spring.application.name=backend

# --- Database ---
# Local dev default points at a local MySQL; Railway overrides these via env vars.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/progress_tracker}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# No migration tool decided yet (see docs/02-backend-hld.md, Section 6.4) -
# using Hibernate to sync the schema for now during active local development.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- JWT ---
jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-before-any-real-deploy-0123456789}
jwt.access-token-ttl-minutes=${JWT_ACCESS_TTL_MINUTES:15}
jwt.refresh-token-ttl-days=${JWT_REFRESH_TTL_DAYS:30}

# --- OTP ---
otp.ttl-minutes=${OTP_TTL_MINUTES:10}
otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
# Placeholder default - exact threshold is still an open item (see docs/02-backend-hld.md, Section 3.6)
otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}

# --- Mail (OTP delivery, via Resend's Java SDK - HTTP API, not SMTP) ---
app.mail.resend-api-key=${RESEND_API_KEY:}
app.mail.from=${MAIL_FROM:onboarding@resend.dev}

# --- Reserved usernames (Section 1.1, Profile Setup) ---
app.username.reserved=admin,api,signin,signup,login,logout,dashboard,public,auth,users,static,assets

# --- Log entry policy (Section 1.1) ---
app.log.max-backdate-days=${LOG_MAX_BACKDATE_DAYS:30}
